
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171914">
  <title>ثانوية النسيم المختلطة</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #171914;
      color: #f1f0e8;
      font-family: Tahoma, Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .container { width: 100%; max-width: 420px; }
    .brand { text-align: center; margin-bottom: 28px; }
    .brand span { color: #a6b77b; font-size: 14px; }
    h1 { font-size: 25px; margin: 12px 0; }
    .brand p { color: #b9bcae; font-size: 14px; }
    .panel {
      background: #242720;
      border: 1px solid #414735;
      border-radius: 16px;
      padding: 24px;
    }
    h2 { font-size: 20px; margin-top: 0; }
    label { display: block; margin: 17px 0 8px; font-size: 14px; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #555b49;
      border-radius: 9px;
      background: #171914;
      color: white;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: #a6b77b; }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #66734a;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #message { min-height: 24px; font-size: 13px; line-height: 1.7; }
    footer {
      text-align: center;
      color: #a6a899;
      font-size: 12px;
      line-height: 2;
      margin-top: 24px;
    }
    footer strong { color: #d6c66d; }
  </style>
</head>
<body>
  <main class="container">
    <header class="brand">
      <span>ثانوية النسيم المختلطة</span>
      <h1>المنصة المدرسية</h1>
      <p>بوابتكم الإلكترونية للخدمات التعليمية</p>
    </header>

    <section class="panel">
      <h2>تسجيل الدخول</h2>
      <form id="login-form">
        <label for="email">البريد الإلكتروني</label>
        <input id="email" type="email" autocomplete="username" required>

        <label for="password">كلمة المرور</label>
        <input id="password" type="password" autocomplete="current-password" required>

        <button id="login-button" type="submit">دخول</button>
        <p id="message" role="status" aria-live="polite"></p>
      </form>
    </section>

    <footer>
      تمت البرمجة والتطوير بواسطة<br>
      <strong>شركة مُهاب | MOHAP</strong>
    </footer>
  </main>

  <script type="module" src="./index.js"></script>
</body>
</html>
